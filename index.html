
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Approval Prediction</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            margin: 0;
        }

        .container {
            background: white;

            width: 400px;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        input:focus {
            outline: none;

            border-color: #007bff;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #007bff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #999;

            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;

            padding: 15px;

            border-radius: 8px;

            text-align: center;

            display: none;
        }

        .approved {
            background: #d4edda;

            color: #155724;
        }

        .rejected {
            background: #f8d7da;

            color: #721c24;
        }

        .error {
            background: #fff3cd;

            color: #856404;
        }

        .probability {
            margin-top: 10px;

            font-size: 18px;

            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Loan Approval Prediction</h1>


    <div class="field">

        <label for="age">
            Age
        </label>

        <input
            type="number"
            id="age"
            placeholder="Enter your age"
            min="18"
            required
        >

    </div>


    <div class="field">

        <label for="income_k">
            Income (K)
        </label>

        <input
            type="number"
            id="income_k"
            placeholder="Enter income in thousands"
            min="0"
            step="0.1"
            required
        >

    </div>


    <div class="field">

        <label for="credit_score">
            Credit Score
        </label>

        <input
            type="number"
            id="credit_score"
            placeholder="Enter credit score"
            min="0"
            max="850"
            required
        >

    </div>


    <button
        id="predictButton"
        onclick="predict()"
    >
        Predict Loan Approval
    </button>


    <div id="result"></div>

</div>


<script>

async function predict() {

    const age =
        document.getElementById("age").value;

    const income_k =
        document.getElementById("income_k").value;

    const credit_score =
        document.getElementById("credit_score").value;


    const result =
        document.getElementById("result");

    const button =
        document.getElementById("predictButton");


    // Validate inputs

    if (!age || !income_k || !credit_score) {

        result.style.display = "block";

        result.className = "error";

        result.innerHTML =
            "<strong>Please fill all fields.</strong>";

        return;
    }


    // Disable button while waiting

    button.disabled = true;

    button.innerText = "Predicting...";


    result.style.display = "block";

    result.className = "";

    result.innerHTML = "Sending request to ML API...";


    try {

    const response = await fetch(
        "/predict",
        {
         method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
             body: JSON.stringify({
            age: Number(age),
            income_k: Number(income_k),
            credit_score: Number(credit_score)
        })
    }
);


        // Check HTTP status

        if (!response.ok) {

            throw new Error(
                `API Error: ${response.status}`
            );

        }


        const data =
            await response.json();


        // Convert probability to percentage

        const probability =
            (data.approval_probability * 100)
            .toFixed(2);


        // Approved

        if (data.approved === 1) {

            result.className = "approved";

            result.innerHTML = `

                <h2>Loan Approved ✅</h2>

                <p>
                    ${data.msg}
                </p>

                <div class="probability">

                    Approval Probability:
                    ${probability}%

                </div>

            `;

        }


        // Rejected

        else {

            result.className = "rejected";

            result.innerHTML = `

                <h2>Loan Not Approved ❌</h2>

                <p>
                    ${data.msg}
                </p>

                <div class="probability">

                    Approval Probability:
                    ${probability}%

                </div>

            `;

        }


    }

    catch (error) {

        console.error(error);


        result.className = "error";

        result.innerHTML = `

            <h3>Connection Error</h3>

            <p>
                Could not connect to the ML API.
            </p>

            <p>
                Please try again.
            </p>

        `;

    }


    finally {

        button.disabled = false;

        button.innerText =
            "Predict Loan Approval";

    }

}

</script>


</body>

</html>
